# Local / single-server setup. For real patient data run on HIPAA-eligible hosting
# (e.g. AWS with a signed BAA), managed encrypted Postgres, and HTTPS in front (Caddy/ALB).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dental}
      POSTGRES_DB: dental
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql://dental:${DB_PASSWORD:-dental}@db:5432/dental
      VOICE_AGENT_URL: http://voice:7860
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  voice:
    build: ./voice
    env_file: ./voice/.env
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "7860:7860"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
