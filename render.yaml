# Render Blueprint for Dental AI Receptionist
# Deploy with 1-click via Render Dashboard -> New + -> Blueprint

databases:
  - name: dental-db
    databaseName: dental
    user: dental
    plan: free

services:
  # ----------------------------------------------------
  # 1. Backend REST API (Node.js + Express + Drizzle ORM)
  # ----------------------------------------------------
  - type: web
    name: dental-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: VOICE_AGENT_URL
        value: "http://localhost:7860"
      - key: JOBS_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: CLINIC_NAME
        sync: false
      - key: CLINIC_PHONE
        sync: false

  # ----------------------------------------------------
  # 2. Web Dashboard (Next.js 15)
  # ----------------------------------------------------
  - type: web
    name: dental-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dental-api
          property: host
      - key: NEXT_PUBLIC_LOGIN_EMAIL
        fromService:
          type: web
          name: dental-api
          envVarKey: OWNER_EMAIL
      - key: NEXT_PUBLIC_LOGIN_PASSWORD
        fromService:
          type: web
          name: dental-api
          envVarKey: OWNER_PASSWORD

  # ----------------------------------------------------
  # 3. Voice Agent (FastAPI + Pipecat AI)
  # ----------------------------------------------------
  - type: web
    name: dental-voice
    runtime: python
    plan: free
    rootDir: voice
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: dental-api
          property: host
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: dental-api
          envVarKey: INTERNAL_API_KEY
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
