# Production on AWS (EC2 + RDS). The database is Amazon RDS PostgreSQL (encrypted, automated backups),
# so there is no "db" container here. Caddy terminates HTTPS with automatic certificates.
#   docker compose -f deploy/aws/docker-compose.prod.yml up -d --build
services:
  api:
    build: ../../api
    env_file: ../../api/.env
    environment:
      VOICE_AGENT_URL: http://voice:7860
      npm_config_cache: /tmp/.npm # read-only filesystem: npx (migrations) writes its cache to tmpfs
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]
    logging: &logs
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /dental-ai/app
        awslogs-create-group: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 30s
      retries: 3

  voice:
    build: ../../voice
    env_file: ../../voice/.env
    environment:
      API_URL: http://api:4000
    depends_on: [api]
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]
    logging: *logs

  web:
    build:
      context: ../../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL, e.g. https://api.yourdomain.com}
    depends_on: [api]
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]
    logging: *logs

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      VOICE_DOMAIN: ${VOICE_DOMAIN:?}
      LINK_DOMAIN: ${LINK_DOMAIN:?}
    depends_on: [api, voice, web]
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [internal, public]

# Only Caddy is reachable from outside; api, voice and web talk on a private network.
networks:
  internal:
    internal: false # outbound internet needed (Deepgram, LLM, Plivo, RDS); no published ports
  public: {}

volumes:
  caddy_data:
