<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dental AI Receptionist — Clickable Demo</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --ink: #16202c;
      --muted: #5e6b7a;
      --line: #e3e7ec;
      --brand: #0f766e;
      --brand2: #14b8a6;
      --brand-soft: #e6f4f2;
      --blue: #2563eb;
      --blue-soft: #e8efff;
      --green: #15803d;
      --green-soft: #e7f6ec;
      --red: #b42318;
      --red-soft: #fdecea;
      --amber: #b45309;
      --amber-soft: #fdf3e2;
      --violet: #6d28d9;
      --violet-soft: #f1ebff;
      --gray-soft: #eef1f4
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45
    }

    a {
      color: var(--brand);
      text-decoration: none;
      cursor: pointer
    }

    a:hover {
      text-decoration: underline
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px
    }

    h2 {
      font-size: 16px;
      margin: 0 0 12px
    }

    h3 {
      font-size: 14px;
      margin: 16px 0 8px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 12px
    }

    .demo-bar {
      background: #fff7e6;
      border-bottom: 1px solid #f3dfb5;
      color: #7a4b00;
      padding: 7px 16px;
      font-size: 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      height: 38px
    }

    .demo-bar button {
      padding: 3px 10px;
      font-size: 12px
    }

    .shell {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: calc(100vh - 38px)
    }

    .sidebar {
      background: #0f1b2a;
      color: #cfd8e3;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      height: calc(100vh - 38px);
      overflow: auto
    }

    .brand {
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 6px 10px 14px
    }

    .brand span {
      display: block;
      font-weight: 400;
      color: #8fa0b3;
      font-size: 12px;
      margin-top: 2px
    }

    .sidebar a {
      color: #cfd8e3;
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .sidebar a:hover {
      background: #1b2b3f;
      text-decoration: none
    }

    .sidebar a.active {
      background: #1f3550;
      color: #fff
    }

    .sidebar .sep {
      font-size: 11px;
      color: #6f8399;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 14px 10px 4px
    }

    .sidebar .spacer {
      flex: 1
    }

    .who {
      font-size: 12px;
      color: #8fa0b3;
      padding: 8px 10px;
      border-top: 1px solid #1f3045
    }

    .main {
      padding: 24px 28px 48px;
      max-width: 1320px;
      width: 100%;
      min-width: 0
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06)
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .k4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .k3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .k2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .stat .value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 4px
    }

    .stat .hint {
      font-size: 12px;
      color: var(--muted)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tr:last-child td {
      border-bottom: none
    }

    tr.click {
      cursor: pointer
    }

    tr.click:hover td {
      background: #fafbfc
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: var(--ink)
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--brand-soft);
      border-color: var(--brand)
    }

    textarea {
      min-height: 80px;
      resize: vertical
    }

    .field {
      margin-bottom: 12px
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .check {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 500;
      color: var(--ink);
      font-size: 14px
    }

    .check input {
      width: auto
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 7px 12px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap
    }

    button:hover {
      background: #f3f5f7
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff
    }

    button.primary:hover {
      background: #0c625b
    }

    button.green {
      background: var(--green-soft);
      border-color: #bfe5cc;
      color: var(--green)
    }

    button.red {
      background: var(--red-soft);
      border-color: #f5c6c1;
      color: var(--red)
    }

    button.sm {
      padding: 4px 9px;
      font-size: 12px
    }

    button.link {
      border: none;
      background: none;
      color: var(--brand);
      padding: 0
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--gray-soft);
      color: var(--muted);
      white-space: nowrap
    }

    .b-BOOKED,
    .b-NEW,
    .b-in {
      background: var(--blue-soft);
      color: var(--blue)
    }

    .b-CONFIRMED,
    .b-CONTACTED {
      background: var(--brand-soft);
      color: var(--brand)
    }

    .b-SHOWED,
    .b-WON {
      background: var(--green-soft);
      color: var(--green)
    }

    .b-NO_SHOW,
    .b-LOST {
      background: var(--red-soft);
      color: var(--red)
    }

    .b-CANCELLED,
    .b-RESCHEDULED,
    .b-out,
    .b-PLAN {
      background: var(--amber-soft);
      color: var(--amber)
    }

    .b-APPT {
      background: var(--violet-soft);
      color: var(--violet)
    }

    .dot {
      display: inline-block;
      min-width: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: #e5484d;
      color: #fff;
      font-size: 11px;
      text-align: center
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted)
    }

    /* filter bar */
    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
      border-radius: 10px 10px 0 0
    }

    .filters input,
    .filters select {
      width: auto;
      padding: 6px 9px;
      font-size: 13px
    }

    .filters .search {
      min-width: 220px;
      flex: 1;
      max-width: 320px
    }

    .filters .count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted)
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted)
    }

    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    /* modal / drawer */
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(15, 27, 42, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      padding: 20px
    }

    .drawer-back {
      position: fixed;
      inset: 0;
      background: rgba(15, 27, 42, .35);
      z-index: 40
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 100%);
      background: #fff;
      z-index: 41;
      box-shadow: -10px 0 30px rgba(0, 0, 0, .12);
      display: flex;
      flex-direction: column
    }

    .drawer .dh {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line)
    }

    .drawer .db {
      padding: 16px 20px;
      overflow: auto;
      flex: 1
    }

    .slots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .slot.sel {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand)
    }

    /* charts */
    .bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 120px
    }

    .bar>div {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 4px
    }

    .bar .col {
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      border-radius: 4px;
      overflow: hidden;
      background: var(--gray-soft)
    }

    .seg-show {
      background: #3fae6a
    }

    .seg-no {
      background: #e5484d
    }

    .bar .lbl {
      font-size: 11px;
      color: var(--muted)
    }

    /* transcript */
    .transcript {
      background: #fafbfc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      max-height: 440px;
      overflow: auto
    }

    .msg {
      margin: 6px 0;
      display: flex
    }

    .msg span {
      padding: 7px 11px;
      border-radius: 12px;
      max-width: 80%
    }

    .msg.ai span {
      background: var(--brand-soft);
      color: #0b4f49
    }

    .msg.caller {
      justify-content: flex-end
    }

    .msg.caller span {
      background: #eef1f4
    }

    .msg.tool span {
      background: none;
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      padding: 2px 4px
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .tabs button {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: none;
      padding: 8px 12px;
      color: var(--muted)
    }

    .tabs button.on {
      border-bottom-color: var(--brand);
      color: var(--ink)
    }

    .stars {
      color: #f5a623;
      letter-spacing: 1px
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #0f1b2a;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      z-index: 60;
      max-width: 380px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: all .25s
    }

    .toast.show {
      opacity: 1;
      transform: none
    }

    /* CRM */
    .kanban {
      display: grid;
      grid-template-columns: repeat(6, minmax(165px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px
    }

    .kcol {
      background: #eef1f4;
      border-radius: 10px;
      padding: 8px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .kcol.over {
      outline: 2px dashed var(--brand);
      background: var(--brand-soft)
    }

    .khead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 2px;
      font-weight: 700;
      font-size: 13px
    }

    .khead small {
      color: var(--muted);
      font-weight: 600
    }

    .ksum {
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px 4px
    }

    .kcard {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      cursor: grab;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .05)
    }

    .kcard:hover {
      border-color: #c9d2dc
    }

    .kcard.dragging {
      opacity: .4
    }

    .kcard .nm {
      font-weight: 700
    }

    .kcard .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .kcard .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--gray-soft);
      color: var(--muted);
      margin: 2px 4px 0 0
    }

    .av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .timeline {
      border-left: 2px solid var(--line);
      margin-left: 8px;
      padding-left: 16px
    }

    .tl {
      position: relative;
      margin-bottom: 14px
    }

    .tl:before {
      content: "";
      position: absolute;
      left: -23px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--brand)
    }

    .tl .t {
      font-size: 12px;
      color: var(--muted)
    }

    .overdue {
      color: var(--red);
      font-weight: 600
    }

    /* phone */
    .phone-wrap {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      align-items: flex-start
    }

    .phone {
      width: 360px;
      height: 740px;
      border-radius: 52px;
      background: linear-gradient(145deg, #1d2733, #0b121a);
      padding: 11px;
      box-shadow: 0 30px 60px rgba(15, 27, 42, .3), inset 0 0 0 2px #2c3846;
      flex-shrink: 0;
      position: relative
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      background: #f3f5f8;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      font-family: -apple-system, "SF Pro Text", ui-sans-serif, system-ui, sans-serif
    }

    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      border-radius: 20px;
      background: #000;
      z-index: 6
    }

    .sbar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 26px 6px;
      font-size: 14px;
      font-weight: 600;
      color: #0d1520;
      flex-shrink: 0
    }

    .sbar svg {
      height: 12px
    }

    .pscroll {
      flex: 1;
      overflow: auto;
      padding: 0 16px 16px
    }

    .pscroll::-webkit-scrollbar {
      display: none
    }

    .ph-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 12px
    }

    .ph-head .t1 {
      font-size: 12px;
      color: #7a8794;
      font-weight: 500
    }

    .ph-head .t2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.3px;
      color: #0d1520
    }

    .ph-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      position: relative
    }

    .ph-avatar i {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      border: 2px solid #f3f5f8
    }

    .hero {
      border-radius: 20px;
      padding: 16px;
      color: #fff;
      background: linear-gradient(135deg, #0f766e 0%, #0e9f8e 60%, #22c3ae 100%);
      box-shadow: 0 10px 24px rgba(15, 118, 110, .28);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08)
    }

    .hero .h1 {
      font-size: 13px;
      opacity: .85
    }

    .hero .h2 {
      font-size: 26px;
      font-weight: 800;
      margin: 2px 0 10px
    }

    .hero .prog {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .25);
      overflow: hidden;
      display: flex
    }

    .hero .prog b {
      display: block;
      height: 100%
    }

    .hero .legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      margin-top: 10px;
      opacity: .95
    }

    .hero .legend span:before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      background: currentColor
    }

    .seg {
      display: flex;
      background: #e6eaef;
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 12px
    }

    .seg button {
      flex: 1;
      border: none;
      background: none;
      border-radius: 9px;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 700;
      color: #5e6b7a;
      justify-content: center
    }

    .seg button.on {
      background: #fff;
      color: #0d1520;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08)
    }

    .pc {
      background: #fff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 12px rgba(16, 24, 40, .04);
      display: flex;
      gap: 12px
    }

    .pc .tm {
      width: 52px;
      flex-shrink: 0;
      text-align: center;
      border-right: 1px solid #eef1f4;
      padding-right: 10px
    }

    .pc .tm b {
      display: block;
      font-size: 15px;
      color: #0d1520
    }

    .pc .tm span {
      font-size: 11px;
      color: #8a96a3
    }

    .pc .bd {
      flex: 1;
      min-width: 0
    }

    .pc .nm {
      font-weight: 700;
      font-size: 15px;
      color: #0d1520;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center
    }

    .pc .sv {
      font-size: 12px;
      color: #7a8794;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      white-space: nowrap
    }

    .pact {
      display: flex;
      gap: 8px;
      margin-top: 10px
    }

    .pact button {
      flex: 1;
      justify-content: center;
      border-radius: 12px;
      padding: 9px 0;
      font-size: 13px;
      border: none
    }

    <div class="card" style="padding:0;margin-bottom:14px">${fbar("rep", [{ k: "prov", type: "chips", opts: [["", "All dentists"], ...PROVIDERS.map(p => [p, p])] }], t.length, todays().length)}</div>

        const html = `<div class="page-head"><div><h1>Notifications</h1><div class="muted">The same alerts the mobile app sends. No patient names in alerts (HIPAA) — details open after sign-in.</div></div><button onclick="S.notes.forEach(n=>n.read=true);rerender()">Mark all read</button></div>
    <div class="card" style="padding:0">${fbar("al", [{ k: "type", label: "All types", opts: TYPES }, { k: "unread", type: "chips", opts: [["", "All"], ["1", "Unread only"]] }], list.length, S.notes.length)}
    <table>${list.map(n => `<tr style="${n.read ? "" : "background:#f4faf9"}"><td style="width:170px" class="muted small">${relDay(n.when)}, ${fmtTime(n.when)}</td><td><b>${esc(n.title)}</b><div class="muted">${esc(n.body)}</div></td><td>${badge("x", (TYPES.find(t => t[0] === n.type) || [, ""])[1])}</td></tr>`).join("") || `<tr><td class="empty">Nothing here.</td></tr>`}</table></div>`;

      },

      "clinic-settings"() {
        const st = S.settings, t = sub || "Clinic & AI";
        const tab = n => `<button class="${t === n ? "on" : ""}" onclick="go('clinic-settings','${n}')">${n}</button>`;
        const tg = (k, label) => `<div class="field"><label class="check"><input type="checkbox" ${st[k] ? "checked" : ""} onchange="S.settings.${k}=this.checked;toast('Saved')"> ${label}</label></div>`;
        let body = "";
        if (t === "Clinic & AI") body = `<div class="card"><div class="grid k2"><div class="field"><label>Clinic name</label><input value="Demo Family Dental"></div><div class="field"><label>Time zone</label><select><option>America/Chicago</option><option>America/New_York</option><option>America/Los_Angeles</option></select></div>
      <div class="field"><label>Address</label><input value="123 Main St, San Antonio, TX"></div><div class="field"><label>Staff transfer number</label><input value="(210) 555-0199"></div></div>
      ${tg("ai", "AI receptionist answers calls 24/7")}
      <div class="field"><label>Greeting (first thing the AI says)</label><input placeholder="Thank you for calling Demo Family Dental, this is the virtual assistant. How can I help you today?"></div>
      <div class="field"><label>What the AI should know (insurance, prices, parking, policies)</label><textarea rows="5">${esc(st.knowledge)}</textarea><div class="small muted">Don't put patient information here.</div></div>
      <button class="primary" onclick="toast('Saved')">Save</button></div>`;
        if (t === "Hours") body = `<div class="card"><p class="muted" style="margin-top:0">The AI only books inside these hours.</p><table>${["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].map((d, i) => `<tr><td style="width:140px"><b>${d}</b></td><td style="width:120px"><label class="check"><input type="checkbox" ${i < 5 ? "checked" : ""}> Open</label></td><td>${i < 5 ? `<div class="row"><input type="time" value="08:00" style="width:140px"> to <input type="time" value="${i === 4 ? "14:00" : "17:00"}" style="width:140px"></div>` : ""}</td></tr>`).join("")}</table><button class="primary" style="margin-top:12px" onclick="toast('Hours saved')">Save hours</button></div>`;
        if (t === "Services & dentists") body = `<div class="grid k2"><div class="card"><h2>Services</h2><table>${SERVICES.map(s => `<tr><td>${s.name}</td><td class="muted">${s.min} min</td></tr>`).join("")}</table></div><div class="card"><h2>Dentists & hygienists</h2><p class="small muted" style="margin-top:0">Each can see one patient at a time — the AI fills both calendars.</p><table>${PROVIDERS.map(p => `<tr><td>${p}</td><td class="muted">Dentist</td></tr>`).join("")}</table></div></div>`;
        if (t === "Follow-ups & texts") body = `<div class="card"><h3 style="margin-top:0">Text messages</h3>${tg("sms", "Send texts (booking confirmations, reminders)")}<div class="field" style="max-width:260px"><label>Reminder text, hours before visit</label><input type="number" value="${st.reminderH}"></div>
      <h3>No-shows</h3>${tg("noShow", "AI calls no-show patients to rebook")}<div class="field" style="max-width:260px"><label>Call after (minutes)</label><input type="number" value="${st.noShowDelay}"></div>
      <h3>Feedback</h3>${tg("feedback", "Ask patients for feedback after their visit")}<div class="field" style="max-width:260px"><label>How</label><select><option>AI phone call</option><option>Text message</option></select></div>
      <h3>CRM</h3><div class="field"><label class="check"><input type="checkbox" checked> Create a CRM contact + call-back task for every AI inquiry</label></div>
      <h3>Calling hours & report</h3><div class="grid k3"><div class="field"><label>AI may call patients from</label><input type="time" value="09:00"></div><div class="field"><label>until</label><input type="time" value="19:00"></div><div class="field"><label>Daily report time</label><input type="time" value="19:00"></div></div>
      <button class="primary" onclick="toast('Saved')">Save</button></div>`;
        if (t === "Team") body = `<div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>2FA</th></tr></thead><tr><td>Dr. Maria Lopez</td><td>owner@demo-dental.com</td><td>Owner</td><td>On</td></tr><tr><td>Mark (treatment coord.)</td><td>mark@demo-dental.com</td><td>Staff</td><td>On</td></tr><tr><td>Jenna (front desk)</td><td>frontdesk@demo-dental.com</td><td>Staff</td><td>${badge("NO_SHOW", "off")}</td></tr></table></div>`;
        if (t === "Security") body = `<div class="grid k2"><div class="card"><h2>Two-step login (2FA)</h2><p class="muted">Google Authenticator / Microsoft Authenticator / Authy.</p>${badge("SHOWED", "On")}</div><div class="card"><h2>Automatic logoff</h2><p class="muted">Web: after 15 minutes idle. Mobile: after 15 minutes in the background.</p></div></div>`;
        if (t === "Audit log") {
          const who = fget("aud", "who"), q = fget("aud", "q");
          const list = S.audit.filter(a => (!who || a.who === who) && has(a.action, q));
          body = `<div class="card" style="padding:0">${fbar("aud", [{ k: "q", type: "search", label: "Search action" }, { k: "who", label: "Everyone", opts: [...new Set(S.audit.map(a => a.who))] }], list.length, S.audit.length)}<table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead>${list.map(a => `<tr><td class="muted small">${fmtDT(a.when)}</td><td>${a.who}</td><td>${a.action}</td></tr>`).join("")}</table></div>`;
        }
        return `<div class="page-head"><div><h1>Settings</h1><div class="muted">AI number: (210) 555-0100</div></div></div><div class="tabs">${["Clinic & AI", "Hours", "Services & dentists", "Follow-ups & texts", "Team", "Security", "Audit log"].map(tab).join("")}</div>${body}`;
      },

      "live-call"() {
        return `<div class="page-head"><div><h1>Try an AI call</h1><div class="muted">Watch the AI receptionist handle a real-style call. Each scenario updates the calendar, CRM, dashboard and phone app.</div></div></div>
    <div class="callbox"><div class="card">
      <div class="call-status"><div class="live" id="liveDot"></div><div><b id="callTitle">Ready</b><div class="small muted" id="callSub">Pick a scenario</div></div></div>
      ${SCENARIOS.map((sc, i) => `<button class="scen" style="width:100%;justify-content:flex-start;margin-bottom:8px" onclick="playCall(${i})" ${callTimer ? "disabled" : ""}>${sc.icon} ${sc.title}</button>`).join("")}
      <p class="small muted">Behind the scenes: Plivo → speech-to-text → AI with booking & CRM tools → natural voice. Italic lines show the tools the AI uses.</p>
      <button class="sm" onclick="stopCall()">Stop</button></div>
      <div class="card"><h2>Live transcript</h2><div class="transcript" id="liveT" style="min-height:420px"><div class="muted">The conversation will appear here…</div></div></div></div>`;
      },

      "mobile-app"() {
        return `<div class="page-head"><div><h1>Clinic mobile app</h1><div class="muted">What the front desk and owner see on their phone. Everything syncs with the dashboard.</div></div></div>
    <div class="phone-wrap"><div class="phone"><div class="island"></div><div class="screen" id="phone"></div></div>
    <div class="card" style="max-width:420px"><h2>In the app</h2>
      <p><b>Today</b> — day progress, filter chips, one tap Came / No-show.</p><p><b>Report</b> — the daily summary pushed every evening.</p>
      <p><b>CRM</b> — new inquiries and follow-ups with one-tap call back.</p><p><b>Alerts</b> — instant push when the AI books, a lead comes in, or feedback is low.</p>
      <p class="muted small">Push text never includes patient names (HIPAA). The app locks after 15 minutes in the background. Face ID / fingerprint login.</p>
      <div class="row"><button onclick="phonePush('New appointment booked','Booked by AI for tomorrow at 9:30 AM. Open the app for details.')">Send a test push</button><button onclick="go('live-call')">▶ Make an AI call</button></div></div></div>`;
      },
    };

    function patientDetail(id) {
      const p = pat(id); const ap = S.appts.filter(a => a.pid === id).sort((a, b) => b.start - a.start); const fb = S.feedback.filter(f => f.pid === id);
      return `<div class="page-head"><div><a class="small" onclick="go('patients')">← Patients</a><div class="row" style="margin-top:6px">${av(pname(p), 44)}<div><h1 style="margin:0">${esc(pname(p))}</h1><div class="muted">${p.phone} ${p.isNew ? badge("x", "new patient") : ""}</div></div></div></div>
    <button class="primary" onclick="openBooking(null,{first:'${esc(p.first)}',last:'${esc(p.last)}',phone:'${p.phone}'})">+ Book appointment</button></div>
  <div class="grid k2"><div class="card"><h2>Details</h2><div class="grid k2"><div class="field"><label>First name</label><input value="${esc(p.first)}"></div><div class="field"><label>Last name</label><input value="${esc(p.last)}"></div></div>
    <div class="field"><label>Private notes (encrypted)</label><textarea placeholder="Notes for the team"></textarea></div>
    <div class="field"><label class="check"><input type="checkbox" ${p.sms ? "checked" : ""}> Agreed to appointment texts</label><label class="check"><input type="checkbox" ${p.calls ? "checked" : ""}> Agreed to automated calls</label></div><button class="primary" onclick="toast('Saved')">Save</button></div>
  <div class="card"><h2>Appointments</h2><table>${ap.map(a => `<tr><td>${fmtDT(a.start)}</td><td class="muted">${a.svc}</td><td>${badge(a.status)}</td></tr>`).join("") || `<tr><td class="muted">None</td></tr>`}</table>
    <h2 style="margin-top:18px">Feedback</h2>${fb.map(f => `<div style="margin-bottom:8px">${stars(f.rating)} <span class="small muted">${fmtDT(f.when)} · ${f.via}</span><div>${esc(f.comment)}</div></div>`).join("") || `<div class="muted">No feedback yet</div>`}</div></div>`;
    }
    function callDetail(id) {
      const c = S.calls.find(x => x.id === id);
      return `<div class="page-head"><div><a class="small" onclick="go('calls')">← Calls</a><h1>${c.dir === "in" ? "Incoming call" : "AI outbound call"} — ${esc(c.who)}</h1><div class="muted">${fmtDT(c.when)} · ${Math.round(c.len / 60)} min · ${c.purpose}</div></div></div>
  <div class="grid k2"><div class="card"><h2>AI summary</h2><p>${esc(c.summary)}</p><div class="small muted">Result: ${c.outcome}</div></div>
  <div class="card"><h2>Transcript <span class="small muted">(encrypted at rest)</span></h2><div class="transcript">${c.lines.map(lineHtml).join("")}</div></div></div>`;
    }
    const lineHtml = ([who, text]) => `<div class="msg ${who}"><span>${who === "tool" ? "⚙ " : ""}${esc(text)}</span></div>`;

    // ================================================================== CRM
    function crmView() {
      const tab = sub || "Pipeline";
      const tabs = ["Pipeline", "Contacts", "Tasks"].map(n => `<button class="${tab === n ? "on" : ""}" onclick="go('crm','${n}')">${n}${n === "Tasks" && S.tasks.filter(overdue).length ? ` <span class="dot">${S.tasks.filter(overdue).length}</span>` : ""}</button>`).join("");
      const open = S.contacts.filter(c => !["WON", "LOST"].includes(c.stage));
      const won = S.contacts.filter(c => c.stage === "WON"), closed = won.length + S.contacts.filter(c => c.stage === "LOST").length;
      const head = `<div class="page-head"><div><h1>CRM</h1><div class="muted">Every inquiry the AI captures lands here. Move leads through the pipeline, log notes and never miss a follow-up.</div></div><button class="primary" onclick="openNewContact()">+ New contact</button></div>
    <div class="grid k4" style="margin-bottom:14px">
      <div class="card stat"><div class="label">Open pipeline</div><div class="value">${money(open.reduce((t, c) => t + c.value, 0))}</div><div class="hint">${open.length} active leads</div></div>
      <div class="card stat"><div class="label">Won this month</div><div class="value" style="color:var(--green)">${money(won.reduce((t, c) => t + c.value, 0))}</div><div class="hint">${won.length} patients</div></div>
      <div class="card stat"><div class="label">Win rate</div><div class="value">${closed ? Math.round(won.length / closed * 100) : 0}%</div><div class="hint">of closed leads</div></div>
      <div class="card stat"><div class="label">From AI receptionist</div><div class="value">${S.contacts.filter(c => c.source.startsWith("AI")).length}</div><div class="hint">of ${S.contacts.length} contacts</div></div></div>
    <div class="tabs">${tabs}</div>`;
      if (tab === "Contacts") return head + crmContacts();
      if (tab === "Tasks") return head + crmTasks();
      return head + crmPipeline();
    }
    const crmFilterDefs = () => [{ k: "q", type: "search", label: "Search name, phone, interest" }, { k: "src", label: "All sources", opts: SOURCES }, { k: "own", label: "All owners", opts: OWNERS }, { k: "tag", label: "All tags", opts: [...new Set(S.contacts.flatMap(c => c.tags))].sort() }];
    const crmMatch = c => has(c.name + c.phone + c.interest, fget("crm", "q")) && (!fget("crm", "src") || c.source === fget("crm", "src")) && (!fget("crm", "own") || c.owner === fget("crm", "own")) && (!fget("crm", "tag") || c.tags.includes(fget("crm", "tag")));
    function crmPipeline() {
      const list = S.contacts.filter(crmMatch);
      return `<div class="card" style="padding:0;margin-bottom:12px">${fbar("crm", crmFilterDefs(), list.length, S.contacts.length)}</div>
  <div class="kanban">${STAGES.map(([k, l]) => {
        const cs = list.filter(c => c.stage === k);
        return `<div class="kcol" data-stage="${k}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropCard(event,'${k}')">
      <div class="khead">${l} <small>${cs.length}</small></div><div class="ksum">${money(cs.reduce((t, c) => t + c.value, 0))}</div>
      ${cs.map(c => {
          const nt = S.tasks.find(t => t.cid === c.id && !t.done);
          return `<div class="kcard" draggable="true" ondragstart="dragId='${c.id}';this.classList.add('dragging')" ondragend="this.classList.remove('dragging')" onclick="openContact('${c.id}')">
          <div class="row" style="gap:8px;flex-wrap:nowrap">${av(c.name, 26)}<div style="min-width:0"><div class="nm">${esc(c.name)}</div><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.interest)}</div></div></div>
          <div>${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <div class="foot"><b>${money(c.value)}</b><span class="${nt && overdue(nt) ? "overdue" : "muted"}">${nt ? (overdue(nt) ? "⚠ " : "⏰ ") + relDay(nt.due) : c.source}</span></div></div>`;
        }).join("")}
    </div>`;
      }).join("")}</div>
  <p class="small muted">Tip: drag a card to another column, or click it to open the contact.</p>`;
    }
    let dragId = null;
    function dropCard(e, stage) { e.preventDefault(); if (!dragId) return; moveStage(dragId, stage); dragId = null; }
    function moveStage(id, stage) {
      const c = contact(id); if (c.stage === stage) return rerender();
      c.acts.unshift({ type: "stage", text: `Moved from ${STAGE_LABEL[c.stage]} to ${STAGE_LABEL[stage]}.`, when: new Date(), by: "Dr. Maria Lopez" });
      c.stage = stage;
      if (stage === "WON") toast(`🎉 <b>${esc(c.name)}</b> won — ${money(c.value)} added to revenue.`); else toast(`${esc(c.name)} → <b>${STAGE_LABEL[stage]}</b>`);
      rerender();
    }
    function crmContacts() {
      const st = fget("crm", "stage");
      const list = S.contacts.filter(c => crmMatch(c) && (!st || c.stage === st)).sort((a, b) => b.created - a.created);
      return `<div class="card" style="padding:0">${fbar("crm", [...crmFilterDefs(), { k: "stage", label: "All stages", opts: STAGES }], list.length, S.contacts.length)}
  <table><thead><tr><th>Contact</th><th>Interested in</th><th>Stage</th><th>Value</th><th>Source</th><th>Owner</th><th>Next follow-up</th></tr></thead><tbody>
  ${list.map(c => {
        const nt = S.tasks.filter(t => t.cid === c.id && !t.done).sort((a, b) => a.due - b.due)[0];
        return `<tr class="click" onclick="openContact('${c.id}')"><td><div class="row" style="gap:8px;flex-wrap:nowrap">${av(c.name, 28)}<div><b>${esc(c.name)}</b><div class="small muted">${c.phone}</div></div></div></td><td>${esc(c.interest)}<div>${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></td><td>${badge(c.stage)}</td><td>${money(c.value)}</td><td class="small">${c.source}</td><td class="small">${c.owner}</td><td class="${nt && overdue(nt) ? "overdue" : "small"}">${nt ? `${relDay(nt.due)} · ${esc(nt.title)}` : "—"}</td></tr>`;
      }).join("") || `<tr><td class="empty" colspan="7">No contacts match.</td></tr>`}</tbody></table></div>`;
    }
    function crmTasks() {
      const st = fget("tasks", "st") || "open", own = fget("tasks", "own"), ty = fget("tasks", "type");
      const base = S.tasks.filter(t => (!own || t.owner === own) && (!ty || t.type === ty));
      const list = base.filter(t => st === "all" ? true : st === "done" ? t.done : st === "overdue" ? overdue(t) : st === "today" ? !t.done && sameDay(t.due, TODAY) : !t.done).sort((a, b) => a.done - b.done || a.due - b.due);

      <div class="seg">${segs.map(([k, l]) => `<button class="${phoneSeg === k ? "on" : ""}" onclick="phoneSeg='${k}';renderPhone()">${l}</button>`).join("")}</div>
      ${list.map(a => {
          const p = pat(a.pid), can = a.start <= NOW && ["BOOKED", "CONFIRMED"].includes(a.status), [hm, ap] = fmtTime(a.start).split(" ");
          return `<div class="pc"><div class="tm"><b>${hm}</b><span>${ap}</span></div><div class="bd"><div class="nm"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pname(p))}</span>${pill(a.status)}</div>
          <div class="sv">${a.svc} · Dr. ${a.prov.split(" ").pop()}${p.isNew ? " · <b style='color:#6d28d9'>New</b>" : ""}${a.source === "AI" ? " · 🤖" : ""}</div>
          ${can ? `<div class="pact"><button class="ok" onclick="setStatus('${a.id}','SHOWED')">✓ Came</button><button class="no" onclick="setStatus('${a.id}','NO_SHOW')">✕ No-show</button></div>` : ""}</div></div>`;
        }).join("") || `<div style="text-align:center;color:#9aa5b1;padding:30px 0">Nothing here</div>`}`;
      }
      if (phoneTab === "report") {
        body = `<div class="ph-head"><div><div class="t1">Daily report</div><div class="t2">${TODAY.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div></div><div class="ph-avatar">ML</div></div>
      <div class="pc" style="align-items:center">${ringSvg(s.came, s.no, s.came + s.no)}<div><div style="font-size:13px;color:#7a8794">Scheduled today</div><div style="font-size:26px;font-weight:800">${s.scheduled}</div>
        <div style="font-size:12.5px;margin-top:4px"><span style="color:#16a34a">● ${s.came} came</span> &nbsp; <span style="color:#dc2626">● ${s.no} no-show</span></div></div></div>
      <div class="kpi"><div><div class="l">🤖 AI booked</div><div class="v">${S.aiBookedToday}</div></div><div><div class="l">📞 Calls handled</div><div class="v">${S.callsToday}</div></div>
        <div><div class="l">💼 New leads</div><div class="v">${S.contacts.filter(c => sameDay(c.created, TODAY)).length}</div></div><div><div class="l">⭐ Rating</div><div class="v">4.6</div></div></div>
      ${[["Came", "SHOWED", "#16a34a"], ["No-show — AI will rebook", "NO_SHOW", "#dc2626"]].map(([l, st, c]) => `<div class="sec" style="color:${c}">${l}</div>${t.filter(a => a.status === st).map(a => `<div class="pc" style="padding:10px 12px;align-items:center">${av(pname(pat(a.pid)), 32)}<div class="bd"><div class="nm" style="font-size:14px">${esc(pname(pat(a.pid)))}</div><div class="sv">${fmtTime(a.start)} · ${a.svc}</div></div></div>`).join("") || '<div style="color:#9aa5b1;font-size:13px;padding:0 4px">None</div>'}`).join("")}`;
      }
      if (phoneTab === "crm") {
        const leads = S.contacts.filter(c => ["NEW", "CONTACTED"].includes(c.stage)).sort((a, b) => b.created - a.created);
        const due = openTasks().filter(x => x.due < at(1, 0)).sort((a, b) => a.due - b.due);
        body = `<div class="ph-head"><div><div class="t1">CRM</div><div class="t2">Follow up</div></div><div class="ph-avatar">ML</div></div>
      <div class="kpi"><div><div class="l">Open pipeline</div><div class="v">${money(S.contacts.filter(c => !["WON", "LOST"].includes(c.stage)).reduce((x, c) => x + c.value, 0))}</div></div><div><div class="l">Due today</div><div class="v" style="color:${S.tasks.filter(overdue).length ? "#dc2626" : "#0d1520"}">${due.length}</div></div></div>
      <div class="sec">New & contacted leads</div>
      ${leads.map(c => `<div class="lead"><div class="top">${av(c.name, 38)}<div style="flex:1;min-width:0"><div class="nm">${esc(c.name)}</div><div style="font-size:12px;color:#7a8794">${c.source} · ${relDay(c.created)}</div></div>${badge(c.stage)}</div>
        <div class="in">${esc(c.interest)}</div><div style="font-size:12px;color:#0f766e;font-weight:700">${money(c.value)}</div>
        <div class="act"><button class="call" onclick="callLead('${c.id}')">${ICON.phone} Call back</button><button onclick="moveStage('${c.id}','APPT');renderPhone()">📅 Booked</button></div></div>`).join("") || '<div style="color:#9aa5b1;font-size:13px">No open leads 🎉</div>'}`;
      }
      if (phoneTab === "alerts") {
        body = `<div class="ph-head"><div><div class="t1">${unread} unread</div><div class="t2">Alerts</div></div><div class="ph-avatar">ML</div></div>
      ${S.notes.map(n => { const [bg, fg, ic] = AL_STYLE[n.type] || AL_STYLE.report; return `<div class="al" style="${n.read ? "" : "box-shadow:0 0 0 1.5px #99e0d6"}"><div class="ic" style="background:${bg};color:${fg}">${ICON[ic]}</div><div style="min-width:0"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><div class="w">${relDay(n.when)}, ${fmtTime(n.when)}</div></div></div>`; }).join("")}`;
        setTimeout(() => { if (phoneTab === "alerts") { S.notes.forEach(n => n.read = true); renderNav(); } }, 1500);
      }
      const keep = ph.querySelector(".push");
      const tab = (k, l, badgeN) => `<button class="${phoneTab === k ? "on" : ""}" onclick="phoneTab='${k}';renderPhone()">${ICON[k]}${l}${badgeN ? `<span class="nb">${badgeN}</span>` : ""}</button>`;
      ph.innerHTML = `<div class="sbar"><span>${nowStr}</span><span style="display:flex;gap:5px;align-items:center"><svg viewBox="0 0 18 12" fill="#0d1520"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#0d1520"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="#0d1520"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="#0d1520"/></svg></span></div>
    <div class="pscroll">${body}</div>
    <div class="ptabbar">${tab("today", "Today")}${tab("report", "Report")}${tab("crm", "CRM", newLeads)}${tab("alerts", "Alerts", unread)}</div>`;
      if (keep) ph.appendChild(keep);
    }
    function callLead(id) { const c = contact(id); c.acts.unshift({ type: "call", text: "Called from the mobile app.", when: new Date(), by: "Dr. Maria Lopez" }); if (c.stage === "NEW") c.stage = "CONTACTED"; toast(`Calling ${esc(c.name)} at ${c.phone}…`); rerender(); }

    // ================================================================== walkthrough (used to record the video)
    function cap(text, sub, pos) { const el = document.getElementById("cap"); if (!text) { el.style.display = "none"; return; } el.innerHTML = esc(text) + (sub ? `<small>${esc(sub)}</small>` : ""); el.style.left = pos === "right" ? "72%" : "50%"; el.style.maxWidth = pos === "right" ? "44%" : "80%"; el.style.display = "block"; }
    function titleCard(h, lines) { const el = document.getElementById("title"); if (!h) { el.style.display = "none"; return; } el.innerHTML = `<h1>${esc(h)}</h1>${lines.map(l => `<p>${esc(l)}</p>`).join("")}`; el.style.display = "flex"; }
    function hl(sel) { document.querySelectorAll(".hl").forEach(e => e.classList.remove("hl")); if (sel) { const e = document.querySelector(sel); if (e) { e.classList.add("hl"); e.scrollIntoView({ block: "nearest" }); } } }

    render();
  </script>
</body>

</html>
